(function(){
const ORDER=['glass','zine','cassette','sheet','sticker'];
const root=document.getElementById('app');
let st={t:'glass',s:'home',m:'one'};
try{const h=(location.hash||'').slice(1).split('-');if(R[h[0]])st.t=h[0];if(h[1]&&SCREENS.some(x=>x[0]==h[1]))st.s=h[1];if(h[2]=='all')st.m='all'}catch(e){}
function render(){
 const M=META[st.t];
 root.innerHTML=`<header><h1>Discair for Mac · Mockups, round 1</h1><p>Five themes, six screens each, drawn at 1280 × 800 in a borderless custom window. All data is sample data. Every theme owns its own layout: the app does the same things in all of them, but each one is built differently. Pick the launch Neobrut theme; Native Glass is the launch macOS theme.</p></header>
 <div class="bar" role="group" aria-label="Theme"><span class="lbl">Theme</span>${ORDER.map(k=>`<button data-t="${k}" aria-pressed="${k==st.t}">${META[k].name}</button>`).join('')}</div>
 <div class="bar" role="group" aria-label="Screen"><span class="lbl">Screen</span>${SCREENS.map(s=>`<button data-s="${s[0]}" aria-pressed="${st.m=='one'&&s[0]==st.s}">${s[1]}</button>`).join('')}<span class="sp"></span><button data-m="all" aria-pressed="${st.m=='all'}">All six at once</button></div>
 <div class="info"><div><b>${M.name} · ${M.kind}</b>${M.blurb}</div><div><b>${st.m=='one'?SCREENS.find(x=>x[0]==st.s)[1]+' screen':'All screens'}</b>${st.m=='one'?M.notes[st.s]:'Click a screen to open it full size. Use ← and → to step through the screens.'}</div></div>
 ${st.m=='one'?`<div id="stage"><div class="wrap">${R[st.t][st.s]()}</div></div>`:`<div class="sheetg">${SCREENS.map(s=>`<button class="th" data-open="${s[0]}" aria-label="Open ${s[1]}"><div class="wrap">${R[st.t][s[0]]()}</div><span>${s[1]}</span></button>`).join('')}</div>`}`;
 fit();
 try{history.replaceState(null,'','#'+st.t+'-'+st.s+(st.m=='all'?'-all':''))}catch(e){}
}
function fit(){
 const s=document.getElementById('stage');
 if(s){const k=Math.min(1,s.clientWidth/1280);const w=s.firstChild;w.style.transform=`scale(${k})`;s.style.height=(800*k)+'px'}
 document.querySelectorAll('.sheetg .th').forEach(b=>{const k=b.clientWidth/1280;b.firstChild.style.transform=`scale(${k})`;b.style.height=(800*k)+'px'});
}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){st.t=b.dataset.t}else if(b.dataset.s){st.s=b.dataset.s;st.m='one'}else if(b.dataset.m){st.m='all'}else if(b.dataset.open){st.s=b.dataset.open;st.m='one'}else return;
 render();
});
addEventListener('keydown',e=>{
 if(e.target.closest&&e.target.closest('input,textarea'))return;
 const i=SCREENS.findIndex(x=>x[0]==st.s);
 if(e.key=='ArrowRight'){st.s=SCREENS[(i+1)%6][0];st.m='one';render()}
 if(e.key=='ArrowLeft'){st.s=SCREENS[(i+5)%6][0];st.m='one';render()}
});
addEventListener('resize',fit);
render();
})();
