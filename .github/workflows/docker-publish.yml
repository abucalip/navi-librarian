name: Validate Docker image (publishing paused)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Gate container validation on runtime smoke test
        run: bash .github/scripts/run_container_smoke.sh navi-librarian:prepublish librarian-prepublish-smoke

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate multi-architecture image build (do not publish)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record validation result
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          {
            echo "## Docker image validation (not published)"
            echo
            echo "- Source commit: $SOURCE_SHA"
            echo "- Trigger ref: $SOURCE_REF"
            echo "- Platforms checked: linux/amd64, linux/arm64"
            echo "- Container runtime smoke: passed (required before build)"
            echo "- Registry publication: intentionally disabled during modularization"
            echo "- Provenance/SBOM: build generation enabled; no registry artifact was created"
          } >> "$GITHUB_STEP_SUMMARY"
