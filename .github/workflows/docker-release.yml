name: Publish Docker release

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docker-release.yml"
      - ".github/scripts/run_container_smoke.sh"
      - "Dockerfile"
      - "requirements.txt"
      - "app/**"
      - "static/**"
      - "*.py"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-release-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Gate release candidate on container runtime smoke test
        run: bash .github/scripts/run_container_smoke.sh navi-librarian:release-candidate librarian-release-candidate-smoke

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate multi-architecture release build (do not publish)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and require exact current main
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Refusing unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          tag_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [[ "$tag_sha" != "$main_sha" ]]; then
            echo "Release tag must point to the exact current main commit." >&2
            echo "tag=$tag_sha main=$main_sha" >&2
            exit 1
          fi
          echo "Verified release tag $GITHUB_REF_NAME at current main SHA $tag_sha"

      - name: Gate publication on container runtime smoke test
        run: bash .github/scripts/run_container_smoke.sh navi-librarian:release-smoke librarian-release-smoke

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version and source-SHA tags
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record publication evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Docker release published"
            echo
            echo "- Release tag: $RELEASE_TAG"
            echo "- Source commit: $SOURCE_SHA"
            echo "- Image: ghcr.io/${GITHUB_REPOSITORY}:$RELEASE_TAG"
            echo "- Source-SHA tag: ghcr.io/${GITHUB_REPOSITORY}:sha-$SOURCE_SHA"
            echo "- Digest: $IMAGE_DIGEST"
            echo "- Platforms: linux/amd64, linux/arm64"
            echo "- Provenance/SBOM: enabled"
            echo "- latest tag: not changed"
          } >> "$GITHUB_STEP_SUMMARY"
