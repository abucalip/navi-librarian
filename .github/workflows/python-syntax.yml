name: Python syntax check

on:
  push:
    branches:
      - feature/acquisition-integration-hardening
  pull_request:
    branches:
      - feature/acquisition-integration-hardening

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m py_compile navidrome_server.py app/main.py
