name: Python syntax check

on:
  push:
    branches:
      - main
      - feature/acquisition-integration-hardening
  pull_request:
    branches:
      - main
      - feature/acquisition-integration-hardening

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application/test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile navidrome_server.py acquisition_completion.py app/main.py app/api/settings.py app/api/utils.py tests/test_acquisition_safety.py tests/test_acquisition_completion.py tests/test_service_settings.py tests/test_app_auth.py tests/test_quality_priority.py tests/test_settings_routes.py
      - name: Run acquisition safety regressions
        run: python -m unittest discover -s tests -v
