name: Validate Docker packaging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request cancels the older run; every push to a branch keeps its own run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # The unit suite takes a few minutes under pytest; a hung or newly slow test must fail fast, not hold a runner.
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Install pytest (CI only, not an application dependency)
        run: python -m pip install --no-cache-dir pytest==9.1.1

      - name: Compile Python modules
        run: python -m py_compile navidrome_server.py app/main.py

      # pytest, not unittest: tests/conftest.py gives every test a private provider gate with no
      # waiting. unittest skips conftest.py, so each MusicBrainz call slept 1.1 s on the shared gate.
      - name: Run unit tests
        run: python -m pytest tests -q -p no:cacheprovider --durations=25

      - name: Build Docker image
        run: docker build -t navi-librarian:test .
