name: Android Paths tests

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-paths.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-paths.yml"

permissions:
  contents: read

jobs:
  android-paths:
    name: Assemble app and test Paths
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug app
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Run focused Paths tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --tests app.discair.PathsTest
