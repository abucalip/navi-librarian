name: macOS package

# Runs only when the macOS client changes (contract docs/MACOS_CLIENT_CONTRACT.md, phase M1).
on:
  pull_request:
    branches: [main]
    paths:
      - "macos/**"
      - "android/contract-fixtures/**"
      - ".github/workflows/macos-package.yml"
  push:
    branches: [main]
    paths:
      - "macos/**"
      - "android/contract-fixtures/**"
      - ".github/workflows/macos-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # the PR diff against its base picks the tests

      # Pull requests run only the test targets whose code (or dependencies) changed; pushes to main and manual runs
      # always run everything, as the backstop. Rules and the dependency map: macos/scripts/select-tests.sh.
      - name: Choose tests
        id: pick
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "origin/$BASE_REF...HEAD" | macos/scripts/select-tests.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf 'tests=all\nbundle=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          test -n "$XCODE" || { echo "No Xcode 26 on this runner"; ls /Applications | grep -i xcode || true; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test (selected targets)
        if: steps.pick.outputs.tests != 'all' && steps.pick.outputs.tests != 'none'
        run: swift test --filter '${{ steps.pick.outputs.tests }}'

      - name: Test (everything)
        if: steps.pick.outputs.tests == 'all'
        run: swift test

      - name: Test through xcodebuild (everything)
        if: steps.pick.outputs.tests == 'all'
        run: xcodebuild -scheme Discair-Package -destination 'platform=macOS' test

      - name: Bundle the app (ad-hoc signed, no update key)
        if: steps.pick.outputs.bundle == 'true'
        run: |
          set -euo pipefail
          scripts/bundle.sh
          codesign --verify --deep --strict .build/bundle/Discair.app
          test -d .build/bundle/Discair.app/Contents/Frameworks/Sparkle.framework
          test -f .build/bundle/Discair-0.1.0.zip
