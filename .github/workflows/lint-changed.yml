name: Lint changed files

on:
  pull_request:
    branches:
      - main

jobs:
  lint-changed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pylint (CI only, not an application dependency)
        run: python -m pip install pylint==4.1.3
      - name: Lint ratchet on changed Python files
        run: python scripts/check_lint_changed.py --base "origin/${{ github.base_ref }}"
