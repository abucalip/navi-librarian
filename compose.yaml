services:
  discair:
    build:
      context: .
    image: ghcr.io/abucalip/navi-librarian:latest
    container_name: discair
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      DISCAIR_DATA_DIR: /data
      NAVIDROME_MUSIC_DIR: /music
      SLSKD_DOWNLOADS_DIR: /downloads
      NAVIDROME_URL: ${NAVIDROME_URL:-}
      NAVIDROME_USER: ${NAVIDROME_USER:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
      SLSKD_URL: ${SLSKD_URL:-}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_SHARED_SECRET: ${LASTFM_SHARED_SECRET:-}
      LASTFM_SESSION_KEY: ${LASTFM_SESSION_KEY:-}
      GUARDIAN_API_KEY: ${GUARDIAN_API_KEY:-}
      LISTENBRAINZ_USERNAME: ${LISTENBRAINZ_USERNAME:-}
      NAVI_EDITION_AWARE_OWNERSHIP: ${NAVI_EDITION_AWARE_OWNERSHIP:-1}
    volumes:
      - librarian_data:/data
      - ${MUSIC_LIBRARY_HOST_PATH:-/media/library/music}:/music
      - ${SLSKD_DOWNLOADS_HOST_PATH:-/media/downloads/slskd/complete}:/downloads

  worker:
    # Background worker: the only writer of knowledge facts in the Server V2 store and the only caller of
    # MusicBrainz for it (web routes write only owner records and caches) (automatic API fill, insights refresh,
    # daily similar-artist precompute). Same image, configuration and data volume.
    image: ghcr.io/abucalip/navi-librarian:latest
    container_name: discair-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    # Longer than app/worker.py SHUTDOWN_GRACE_SECONDS (25 s), so the loops can stop before Docker kills the process.
    stop_grace_period: 30s
    depends_on:
      - discair
    environment:
      DISCAIR_DATA_DIR: /data
      NAVIDROME_URL: ${NAVIDROME_URL:-}
      NAVIDROME_USER: ${NAVIDROME_USER:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
      NAVI_AUTO_FILL_POLL_SECONDS: ${NAVI_AUTO_FILL_POLL_SECONDS:-}
      LISTENBRAINZ_USERNAME: ${LISTENBRAINZ_USERNAME:-}
      # The similar-artist precompute uses Last.fm; the key's default comes from here, as in the web service.
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
    volumes:
      - librarian_data:/data

volumes:
  librarian_data:
