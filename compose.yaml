services:
  discair:
    build:
      context: .
    image: ghcr.io/abucalip/navi-librarian:latest
    container_name: discair
    restart: unless-stopped
    init: true
    # Python one-liner: the image has no curl. /api/auth/status is public and touches no provider or store.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/api/auth/status', timeout=8)"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      DISCAIR_DATA_DIR: /data
      NAVIDROME_MUSIC_DIR: /music
      SLSKD_DOWNLOADS_DIR: /downloads
      NAVIDROME_URL: ${NAVIDROME_URL:-}
      NAVIDROME_USER: ${NAVIDROME_USER:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
      SLSKD_URL: ${SLSKD_URL:-}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      GUARDIAN_API_KEY: ${GUARDIAN_API_KEY:-}
      LISTENBRAINZ_USERNAME: ${LISTENBRAINZ_USERNAME:-}
      NAVI_EDITION_AWARE_OWNERSHIP: ${NAVI_EDITION_AWARE_OWNERSHIP:-1}
    volumes:
      - librarian_data:/data
      - ${MUSIC_LIBRARY_HOST_PATH:-/media/library/music}:/music
      - ${SLSKD_DOWNLOADS_HOST_PATH:-/media/downloads/slskd/complete}:/downloads

  worker:
    # Background worker: the only writer of knowledge facts in the Server V2 store and the only caller of
    # MusicBrainz for it (web routes write only owner records and caches) (automatic API fill, insights refresh,
    # daily similar-artist precompute, scheduled discovery and lens list refreshes). Same image, configuration and
    # data volume. While it is down, recommendation lists are not refreshed on schedule.
    image: ghcr.io/abucalip/navi-librarian:latest
    container_name: discair-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    init: true
    # Exits 1 unless the heartbeat file (app/services/worker_heartbeat.py) is under 5 minutes old; the heartbeat
    # only advances while both scheduler threads are alive, so a long precompute is still healthy.
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.worker_heartbeat"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    # Longer than app/worker.py SHUTDOWN_GRACE_SECONDS (25 s), so the loops can stop before Docker kills the process.
    stop_grace_period: 30s
    depends_on:
      - discair
    environment:
      DISCAIR_DATA_DIR: /data
      NAVIDROME_URL: ${NAVIDROME_URL:-}
      NAVIDROME_USER: ${NAVIDROME_USER:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
      NAVI_AUTO_FILL_POLL_SECONDS: ${NAVI_AUTO_FILL_POLL_SECONDS:-}
      LISTENBRAINZ_USERNAME: ${LISTENBRAINZ_USERNAME:-}
      # K3 owned prefetch: daily per-provider caps; the default is the owner-approved set (docs/plans/efficiency.md, K3).
      # Set OWNED_PREFETCH_BUDGETS=off to switch it off (an empty value falls back to this default).
      OWNED_PREFETCH_BUDGETS: ${OWNED_PREFETCH_BUDGETS:-musicbrainz=600,listenbrainz=300,deezer=600,apple=400,wikipedia=300}
    volumes:
      - librarian_data:/data

volumes:
  librarian_data:
